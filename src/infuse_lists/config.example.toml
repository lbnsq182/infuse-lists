[directors]
# One list per director with at least `min_movies` distinct films in the selected shares.
enabled = true
type = "collection"
min_movies = 2
name_template = "{name}"      # e.g. "Dir. {name}" or "{name} ({count})"
sort = "year"
latin_names = true            # with tmdb_api_key: "박찬욱" becomes "Park Chan-wook"
