[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infuse-lists"
version = "0.1.0"
description = "Build Infuse playlists and collections on macOS from your library metadata"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "lbnsq182" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/lbnsq182/infuse-lists"

[project.scripts]
infuse-lists = "infuse_lists.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infuse_lists = ["config.example.toml"]
